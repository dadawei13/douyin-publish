<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>发布到抖音</title>
    <style>
        body{background:#f5f5f5;padding:20px;font-family:Arial}
        .box{background:white;padding:20px;border-radius:12px}
        img{width:100%;border-radius:10px;margin:10px 0}
        button{width:100%;padding:16px;background:#00be73;color:white;font-size:16px;border:none;border-radius:10px;margin-top:10px}
    </style>
</head>
<body>
    <div class="box" id="box">加载中...</div>

    <script>
        // ==========================================
        // 只改这里！！！
        // ==========================================
        const DOUYIN_CLIENT_KEY = "awjmaxwrz3moxpzg";

        // 内容（你可以在这里加 1001、1002、1003）
        const CONTENT = {
            "1001": {
                title: "空调服务分享3",
                text: "专业空调安装维修服务完成！",
                image: "https://picsum.photos/600/800"
            }
        };

        // 读取 id
        const id = new URLSearchParams(location.search).get("id") || "1001";
        const data = CONTENT[id];

        // 显示页面
        document.getElementById("box").innerHTML = `
            <h3>${data.title}</h3>
            <img src="${data.image}">
            <p>${data.text}</p>
            <button onclick="go()">立即发布到抖音</button>
        `;

        // ==========================================
        // 核心：能用的跳转格式（不用域名审核）
        // ==========================================
        function go() {
            const text = encodeURIComponent(data.text);
            const img = encodeURIComponent(data.image);

            // 👇 这是唯一能跳的格式
            const url = `https://www.douyin.com/share-platform/share?client_key=${DOUYIN_CLIENT_KEY}&content_type=image&image_list=${img}&text=${text}`;

            location.href = url;
        }
    </script>
</body>
</html>
